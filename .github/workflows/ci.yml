name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r web_requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static checks
        shell: pwsh
        run: |
          node --check web/static/app.js
          node --check web/static/pet.js
          node --check web/static/workbench-core.js
          python -m compileall -q pipeline web tools
          git diff --check
      - name: Full test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = $null
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python -m pytest -q -p no:cacheprovider --basetemp="$env:GITHUB_WORKSPACE\.pytest-public"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend behavior tests
        shell: pwsh
        run: |
          node --test tests/delivery_frontend.test.cjs tests/session_recovery.test.cjs tests/frontend_feedback.test.cjs tests/static/workbench_core.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable package build
        shell: pwsh
        run: |
          python -m pip install uv==0.11.23
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uvPath = (Get-Command uv -ErrorAction Stop).Source
          & .\tools\build_windows_portable.ps1 -OutputRoot "$env:GITHUB_WORKSPACE\.ci-portable" -UvPath $uvPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = Join-Path "$env:GITHUB_WORKSPACE\.ci-portable" "subtitle-pipeline-$version-windows-x64-portable.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw) -split "\s+")[0]
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Portable archive hash mismatch" }
